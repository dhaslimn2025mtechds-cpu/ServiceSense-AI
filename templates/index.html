<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServiceSense AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .label {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ServiceSense AI</h1>

    <p>Customer Complaint Classification & Resolution Suggestion System</p>

    <form method="POST">

        <textarea
            name="complaint"
            placeholder="Enter customer complaint here..."
            required>{{ complaint }}</textarea>

        <br>

        <button type="submit">
            Analyze Complaint
        </button>

    </form>


    {% if result %}

    <div class="result">

        <div class="label">
            Predicted Intent:
        </div>

        <p>
            {{ result.intent }}
        </p>


        <div class="label">
            Suggested Resolution:
        </div>

        <p>
            {{ result.resolution }}
        </p>


        <div class="label">
            Similarity Score:
        </div>

        <p>
            {{ result.similarity }}
        </p>

    </div>

    {% endif %}

</div>

</body>

</html>
